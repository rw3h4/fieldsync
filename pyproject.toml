[project]
name = "fieldsync"
version = "0.1.0"
description = "FieldSync: fault-tolerant collaborative records editor (RGA CRDT, relays with failover). Distributed Systems course project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.19.0",
    "websockets>=17.4",
]

[project.scripts]
relay = "fieldsync.net.relay:main"
node = "fieldsync.ui.node.app:main"
sim = "fieldsync.ui.sim.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldsync"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
